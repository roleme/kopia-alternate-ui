name: 🚀 Release

on:
  push:
    tags:
      - v*
jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="kopia-alternate-ui-${VERSION}.tar.gz"
          tar -czf "$ARCHIVE" -C dist .
          sha256sum "$ARCHIVE" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
      - name: Publish dist branch
        run: |
          ls dist/assets > /tmp/assets-current
          git worktree add --orphan -b dist-publish ../dist-site
          cp -a dist/. ../dist-site/
          cp /tmp/assets-current ../dist-site/.assets-current
          if git fetch --depth=1 origin dist; then
            git show FETCH_HEAD:.assets-current | sed 's#^#assets/#' > /tmp/assets-carry || true
            while IFS= read -r file; do
              [ -e "../dist-site/${file}" ] || git show "FETCH_HEAD:${file}" > "../dist-site/${file}"
            done < /tmp/assets-carry
          fi
          cd ../dist-site
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "dist ${GITHUB_REF_NAME}"
          git push -f origin HEAD:refs/heads/dist
